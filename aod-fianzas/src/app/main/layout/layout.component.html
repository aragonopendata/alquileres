<div class="flex flex-col h-screen">
    <div class="bg-white p-6 border-b border-gray-200">
        <div class="flex justify-center">
            <div class="inline-flex bg-gray-800 rounded-lg p-1 shadow-lg">
                <a routerLink=""
                   routerLinkActive="bg-white text-gray-800 shadow-md"
                   [routerLinkActiveOptions]="{exact: true}"
                   class="inline-flex items-center px-6 py-3 text-sm font-semibold text-white rounded-md hover:bg-gray-700 transition-all duration-200 min-w-[200px] justify-center">
                    Consulta mediante mapa
                </a>
                <a routerLink="simple"
                   routerLinkActive="bg-white text-gray-800 shadow-md"
                   class="inline-flex items-center px-6 py-3 text-sm font-semibold text-white rounded-md hover:bg-gray-700 transition-all duration-200 min-w-[200px] justify-center">
                    Consulta mediante calle
                </a>
            </div>
        </div>
    </div>

    <div class="flex-1 p-4 overflow-y-auto">
        <router-outlet></router-outlet>        
    </div>

    <app-footer class="bg-white p-3 border-t-2"></app-footer>

</div>
