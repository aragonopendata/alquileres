server {
    listen 80;
    server_name _;

    # Root location - redirect to application path
    location = / {
        return 301 /servicios/alquileres/;
    }

    # Application location with trailing slash
    location /servicios/alquileres/ {
        alias /usr/share/nginx/html/servicios/alquileres/;
        index index.html;

        # SPA routing - fallback to index.html
        try_files $uri $uri/ /servicios/alquileres/index.html;

        # Prevent caching of application files
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }
}
