[pytest]
# Pytest configuration for AOD Fianzas Backend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --color=yes
    --strict-markers
    --tb=short

# Coverage options (uncomment when ready to track coverage)
# addopts =
#     --cov=services
#     --cov-report=html
#     --cov-report=term-missing:skip-covered
#     --cov-fail-under=70

# Markers
markers =
    integration: marks tests as integration tests (may require external services)
    unit: marks tests as unit tests
    slow: marks tests as slow (deselect with '-m "not slow"')

# Logging
log_cli = false
log_cli_level = INFO
