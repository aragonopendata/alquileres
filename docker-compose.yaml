services:
  frontend:
    build: ./aod-fianzas/
    container_name: aod-fianzas-front
    volumes:
      # Custom nginx configuration
      - ./nginx.conf:/etc/nginx/default.conf
    ports:
      - "${FRONTEND_PORT:-4201}:80"
    networks:
      - infraestructura_opendata
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-pro}
    restart: unless-stopped

  backend:
    build: ./aod-fianzas-back/
    container_name: aod-fianzas-back
    networks:
      - infraestructura_opendata
    environment:
      # Environment setting (passed to backend application)
      ENVIRONMENT: ${ENVIRONMENT:-pro}

      # Redis Configuration
      REDIS_HOST: ${REDIS_HOST:-aod-fianzas-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}

      # IGEAR Service Timeouts
      IGEAR_REQUEST_TIMEOUT: ${IGEAR_REQUEST_TIMEOUT:-180}
      IGEAR_CONNECTION_TIMEOUT: ${IGEAR_CONNECTION_TIMEOUT:-30}
      IGEAR_READ_TIMEOUT: ${IGEAR_READ_TIMEOUT:-120}
      IGEAR_WRITE_TIMEOUT: ${IGEAR_WRITE_TIMEOUT:-30}

      # CORS Override (optional)
      CORS_ORIGINS_OVERRIDE: ${CORS_ORIGINS_OVERRIDE:-}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-4202}:8000"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aod-fianzas-redis
    networks:
      - infraestructura_opendata
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:

networks:
  infraestructura_opendata:
    external: true
