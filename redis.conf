# Redis Configuration for AOD Fianzas Geographic Search Caching

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory and performance
maxmemory 100mb
maxmemory-policy allkeys-lru

# Persistence - Save snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Clients
maxclients 10000
timeout 0
tcp-keepalive 300

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Security
requirepass ""

# Modules
# (none for basic caching)

# Append only file
appendonly no

# Lua scripting
lua-time-limit 5000

# Redis cluster
# cluster-enabled no

# Keyspace notifications (useful for cache invalidation)
notify-keyspace-events ""

# Hash settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings  
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Zset settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Streams settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol buffer limit
proto-max-bulk-len 512mb

# Frequency of rehashing
hz 10

# Background tasks
dynamic-hz yes

# AOF settings (disabled for caching)
aof-rewrite-incremental-fsync yes
aof-use-rdb-preamble yes

# RDB-AOF persistence
rdb-save-incremental-fsync yes

# Jemalloc background thread
jemalloc-bg-thread yes

# Delete expired keys
activedefrag yes 